<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>List to Cart Prototype</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="List to Cart">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>body{margin:0} :root{padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>

<meta name="color-scheme" content="light only">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: notes column + one phone canvas (480 × 1067 design units, scaled to fit). Single light look: it mirrors the app. */
:root {
  color-scheme: light only;
  --stage: #ebe7df;
  --green: #00894a;
  --mint: #e5f4ed;
  --ink: #222222;
  --muted: #666666;
  --line: #dddddd;
  --grey: #f2f2f2;
  --err: #b42318; --err-bg: #fff0ee;
  --warn: #8a6100; --warn-bg: #fff8e0; --warn-line: #c99524;
  --ok: #003d25; --ok-bg: #ecfff6;
  --dark: #063e27;
  --font: "Roboto", -apple-system, "Segoe UI", Arial, sans-serif;
}
html, body { height: 100%; color-scheme: light only; }
input, button, textarea { color-scheme: light only; -webkit-appearance: none; appearance: none; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font); }
#root { height: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--green); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.stage { min-height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; padding-block: 20px; padding-inline: 16px; box-sizing: border-box; }
.side { width: 300px; flex: none; font-size: 15px; line-height: 1.55; color: #3c3f3c; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--green); }
.side h1 { font-size: 40px; line-height: 1.05; margin: 8px 0 12px; color: #1b1f1c; font-weight: 700; letter-spacing: -.01em; }
.side p { margin: 0 0 12px; }
.side ul { padding-left: 18px; margin: 0 0 18px; }
.side li { margin-bottom: 6px; }
.note { font-size: 12px; color: #777; margin-top: 14px !important; }
.test { background: var(--dark); color: #fff; border-radius: 16px; padding: 16px; }
.test-t { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #9fd8bb; }
.test-n { display: flex; gap: 26px; margin: 8px 0 12px; }
.test-n b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.test-n span { font-size: 12px; color: #9fd8bb; }
.tbtn { width: 100%; border: 0; border-radius: 10px; padding: 10px; background: #f6d64e; color: var(--dark); font-weight: 700; }
.tbtn.stop { background: #fff; }
.test p { font-size: 12px; color: #cfe8db; margin: 10px 0 0; }

.frame { position: relative; flex: none; border-radius: 34px; overflow: hidden; box-shadow: 0 0 0 9px #111, 0 30px 60px rgba(0,56,30,.22); background: #fff; }
.canvas { position: absolute; left: 0; top: 0; width: 480px; height: 1067px; transform-origin: 0 0; overflow: hidden; background: #fff; }
.fit { position: absolute; top: 0; width: 480px; height: 1067px; transform-origin: 0 0; }
.dark { background: #111; }
.m-test, .m-panel { display: none; }
@media (max-width: 860px) { .side { display: none; } }
@media (max-width: 619px) {
  body { background: #fff; }
  .stage { padding: 0; display: block; }
  .frame { margin: 0 auto; border-radius: 0; box-shadow: none; }
  .frame.mobile { position: fixed; left: 0; }
  .m-test { display: block; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); left: 50%; transform: translateX(-50%); z-index: 50; border: 0; border-radius: 999px; background: var(--dark); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 12px; font-variant-numeric: tabular-nums; opacity: .9; }
  .m-panel { display: block; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 34px); left: 50%; transform: translateX(-50%); width: 240px; z-index: 50; }
}

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; overflow: hidden; }
.screen.col { display: flex; flex-direction: column; }
.screen.center { align-items: center; justify-content: center; padding: 32px; }
.grey { background: var(--grey); }
.white { background: #fff; }
.full { position: absolute; left: 0; top: 0; width: 480px; height: 1067px; display: block; }
.slice { position: absolute; left: 0; width: 480px; display: block; }
.hot { position: absolute; background: transparent; border: 0; padding: 0; border-radius: 12px; }
.hot.round { border-radius: 999px; }
.hot:active { background: rgba(0,0,0,.07); }
.pad { padding: 16px; }
.empty { color: var(--muted); font-size: 15px; line-height: 1.45; }
.corrected { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
.in { padding: 0 16px; margin: 0 0 12px; }

/* search */
.s-input { position: absolute; left: 62px; top: 62px; width: 240px; height: 46px; border: 0; outline: 0; background: transparent; font-size: max(17px, calc(16px / var(--s, 1))); padding: 0 0 0 6px; color: var(--ink); }
.s-input.typing { background: #fff; }
.s-input { color: #222222; }
.s-input:focus-visible { outline: 0; }
.s-clear { position: absolute; left: 306px; top: 63px; width: 46px; height: 44px; border: 0; background: #fff; display: grid; place-items: center; border-radius: 0 22px 22px 0; }
.s-body { position: absolute; top: 122px; left: 0; right: 0; bottom: 0; overflow-y: auto; scrollbar-width: none; }
.s-body .nudge { margin: 8px 16px 4px; width: 448px; }
.slice-wrap { position: relative; }
.slice-wrap img { display: block; width: 480px; }
.s-results { position: absolute; top: 122px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 10px 16px 120px; box-sizing: border-box; scrollbar-width: none; }
.grid3 { display: grid; grid-template-columns: repeat(3, 136px); gap: 22px 14px; }
.nudge { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-radius: 16px; background: var(--mint); padding: 12px 14px; margin-bottom: 14px; text-align: left; box-sizing: border-box; }
.nudge-ic { width: 48px; height: 48px; border-radius: 12px; background: #fff; display: grid; place-items: center; flex: none; }
.nudge-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nudge-txt b { font-size: 16px; font-weight: 500; color: var(--ink); }
.nudge-txt span { font-size: 14px; color: #444; }
.listdetect { display: flex; align-items: center; gap: 12px; background: var(--mint); border-radius: 16px; padding: 14px 14px 14px 18px; margin-bottom: 14px; }
.listdetect div { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.listdetect b { font-size: 16px; font-weight: 500; }
.listdetect span { font-size: 14px; color: #444; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listdetect button { border: 0; background: var(--green); color: #fff; font-weight: 700; font-size: 15px; border-radius: 6px; padding: 10px 14px; flex: none; }

/* tiles */
.tile { flex: none; }
.tile-img { position: relative; }
.tile-img img { width: 100%; height: 100%; display: block; border-radius: 8px; }
.add { position: absolute; display: grid; place-items: center; padding: 0; background: #fff; border: 1.5px solid #46a974; border-radius: 6px; }
.stepper { position: absolute; display: flex; align-items: center; justify-content: space-between; background: var(--green); color: #fff; border-radius: 6px; font-weight: 700; font-size: 17px; }
.stepper button { width: 30px; height: 100%; border: 0; background: transparent; display: grid; place-items: center; padding: 0; }
.stepper span { min-width: 18px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper.static { position: static; width: 100px; height: 40px; flex: none; }
.tile-txt { padding-top: 14px; }
.offer { display: inline-block; background: #ffe14f; color: #1b1b1b; font-size: 13px; font-weight: 700; padding: 2px 6px; border-radius: 3px; box-shadow: inset 0 -2px 0 #5c4d00; }
.price { font-size: 17px; font-weight: 700; color: #1b1b1b; margin-top: 6px; }
.price s { font-size: 11px; color: #888; font-weight: 400; margin-left: 4px; }
.chilled { display: inline-block; background: #efe9f8; color: #5b3e96; font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-top: 4px; }
.brand { font-size: 13px; color: #888; font-weight: 500; letter-spacing: .03em; margin-top: 6px; }
.pname { font-size: 15px; color: var(--ink); line-height: 1.3; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.psize { font-size: 14px; color: #888; margin-top: 4px; }
.eta { display: flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; margin-top: 6px; }

/* header */
.sb { display: block; width: 480px; height: 48px; flex: none; }
.hdr { height: 87px; flex: none; background: #fff; display: flex; align-items: center; padding: 0 22px 0 28px; }
.hdr-back { width: 40px; height: 40px; border: 0; background: transparent; display: grid; place-items: center; margin-right: 14px; padding: 0; }
.hdr-txt { flex: 1; }
.hdr-title { font-size: 21px; font-weight: 500; color: var(--ink); }
.hdr-sub { font-size: 15px; color: var(--muted); margin-top: 4px; }

/* review */
.banner { height: 40px; flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; }
.banner.err { background: var(--err-bg); color: var(--err); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.ok { background: var(--ok-bg); color: var(--ok); }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
.rv-body { flex: 1; overflow-y: auto; padding: 8px 16px 16px; scrollbar-width: none; }
.rv-card { background: #fff; border-radius: 16px; padding: 8px 31px 8px 30px; }
.rv-item { padding: 8px 0; }
.rv-row { display: flex; align-items: center; gap: 23px; }
.cbox { width: 26px; height: 26px; border: 1.5px solid #cccccc; border-radius: 3px; background: #fff; padding: 0; display: grid; place-items: center; flex: none; }
.cbox.on { background: var(--green); border-color: var(--green); }
.cbox:disabled { cursor: not-allowed; }
.field { flex: 1; height: 60px; border: 1px solid var(--line); border-radius: 4px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 20px; background: #fff; min-width: 0; cursor: text; }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #222222; font-size: max(18px, calc(16px / var(--s, 1))); height: 100%; padding: 0; }
.field.unsure { background: var(--warn-bg); border-color: var(--warn-line); }
.field.unread { border-color: var(--err); }
.field.unread input::placeholder { color: #777777; opacity: 1; font-size: 16px; }
.field:focus-within { border-color: var(--green); }
.dym { padding: 12px 0 2px 32px; }
.dym > span { font-size: 14px; color: #555; }
.chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
.chip { height: 32px; padding: 0 16px; border: 1px solid #cfcfcf; border-radius: 999px; background: #fff; font-size: 14px; font-weight: 500; }
.chip.on { background: var(--mint); border-color: var(--green); color: var(--green); }
.rv-foot { flex: none; background: #fff; padding: 12px 16px 14px; }
.new-row { display: flex; gap: 11px; align-items: center; }
.new-row input { flex: 1; min-width: 0; height: 60px; border: 1.5px solid #51b68b; border-radius: 6px; padding: 0 18px; font-size: max(18px, calc(16px / var(--s, 1))); outline: 0; box-sizing: border-box; background: #ffffff; color: #222222; }
.new-row input::placeholder { color: #999999; opacity: 1; }
.plusbtn { width: 40px; height: 40px; border: 0; border-radius: 4px; background: var(--green); display: grid; place-items: center; padding: 0; flex: none; }
.helper { font-size: 14px; color: var(--muted); line-height: 1.35; margin: 8px 0 12px; }
.actions { display: grid; grid-template-columns: 1fr 220px; gap: 0; border-top: 1px solid var(--line); margin: 0 -16px; padding: 10px 16px 0; }
.save { border: 0; background: transparent; color: var(--green); font-size: 18px; font-weight: 700; height: 52px; }
.proceed { border: 0; background: var(--green); color: #fff; font-size: 18px; font-weight: 700; height: 52px; border-radius: 4px; }
.proceed.wide { width: 100%; max-width: 360px; margin-top: 24px; }

/* results */
.rs-body { flex: 1; overflow-y: auto; padding: 9px 16px 0; scrollbar-width: none; }
.rs-card { background: #fff; border-radius: 16px; margin-bottom: 16px; padding: 22px 0 26px; }
.rs-head { display: flex; justify-content: space-between; align-items: center; padding: 0 16px; margin-bottom: 22px; }
.rs-head h3 { margin: 0; font-size: 21px; font-weight: 500; color: var(--ink); }
.chevbox { width: 38px; height: 38px; border: 1px solid #d9d9d9; border-radius: 4px; display: grid; place-items: center; }
.hscroll { display: flex; gap: 31px; overflow-x: auto; padding: 0 16px 6px 26px; scrollbar-width: none; }
.cartbar { position: absolute; left: 20px; right: 17px; bottom: 45px; height: 60px; display: flex; gap: 12px; z-index: 5; }
.cb-free { flex: 1; display: flex; align-items: center; gap: 12px; background: var(--mint); border: 1px solid #cde8da; border-radius: 30px; padding: 0 14px 0 6px; min-width: 0; }
.cb-ic { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 1px solid #cde8da; display: grid; place-items: center; flex: none; }
.cb-free b { display: block; font-size: 15px; font-weight: 500; color: var(--ink); }
.cb-free span { display: block; font-size: 14px; color: #444; }
.cb-go { width: 133px; flex: none; border: 0; border-radius: 30px; background: var(--dark); color: #fff; display: flex; align-items: center; justify-content: space-around; font-size: 22px; font-weight: 700; padding: 0 10px; }

/* cart */
.pad16 { padding: 16px; }
.deliv { display: flex; align-items: center; gap: 6px; font-size: 16px; margin-bottom: 12px; }
.cl { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid #eee; }
.cl-img { width: 64px; height: 70px; flex: none; overflow: hidden; border-radius: 8px; }
.cl-img img { width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.cl-txt { flex: 1; min-width: 0; }
.bill > div { display: flex; justify-content: space-between; font-size: 15px; padding: 4px 0; font-variant-numeric: tabular-nums; }
.bill .free { color: var(--green); font-weight: 700; }
.bill .tot { border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 10px; font-weight: 700; font-size: 17px; }
.place { flex: none; background: #fff; padding: 12px 16px 40px; }
.place button { width: 100%; height: 56px; border: 0; border-radius: 8px; background: var(--green); color: #fff; font-size: 18px; font-weight: 700; }

/* done */
.done-badge { width: 96px; height: 96px; border-radius: 50%; background: var(--green); display: grid; place-items: center; }
.done-h { font-size: 30px; margin: 22px 0 6px; }
.done-p { color: var(--muted); margin: 0 0 20px; font-size: 17px; }
.done-stats { display: flex; gap: 32px; background: var(--grey); border-radius: 16px; padding: 16px 28px; }
.done-stats b { display: block; font-size: 30px; font-variant-numeric: tabular-nums; text-align: center; }
.done-stats span { font-size: 13px; color: var(--muted); display: block; text-align: center; }

/* sheets, overlays */
.sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: flex-end; z-index: 20; }
.sheet { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 10px 20px 48px; box-sizing: border-box; }
.sheet-grab { width: 44px; height: 5px; border-radius: 3px; background: #ccc; margin: 0 auto 14px; }
.sheet-h { font-size: 21px; font-weight: 500; margin: 0 0 14px; }
.list-row { display: flex; align-items: center; gap: 14px; width: 100%; border: 1px solid #e5e5e5; background: #fff; border-radius: 14px; padding: 14px; margin-bottom: 10px; text-align: left; }
.lr-ic { width: 44px; height: 44px; border-radius: 10px; background: var(--mint); display: grid; place-items: center; flex: none; }
.lr-txt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lr-txt b { font-size: 16px; font-weight: 500; }
.lr-txt span { font-size: 14px; color: var(--muted); }
.gal { display: flex; gap: 14px; }
.gal-item { border: 0; background: transparent; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: var(--muted); }
.gal-item img { width: 190px; height: 204px; object-fit: cover; border-radius: 12px; display: block; }
.an-bg { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 30; }
.an-card { width: 300px; background: #fff; border-radius: 18px; padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.an-card b { font-size: 18px; font-weight: 500; margin-top: 10px; }
.an-card span { font-size: 14px; color: var(--muted); }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #d7eee2; border-top-color: var(--green); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: absolute; left: 50%; bottom: 230px; transform: translateX(-50%); background: #222; color: #fff; font-size: 16px; font-weight: 500; padding: 12px 18px; border-radius: 10px; white-space: nowrap; z-index: 40; }
</style>

<div id="root"></div>
